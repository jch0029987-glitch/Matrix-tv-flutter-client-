name: Test Keystore Credentials

on:
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  test-keystore:
    name: Verify Keystore & Passwords
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Verify Keystore Integrity and Credentials
        run: |
          echo "=== 1. Checking File Existence and Size ==="
          ls -lh android/app/release-key.jks

          echo -e "\n=== 2. Listing Keystore Entries (Testing Store Password & Alias) ==="
          # This command checks if the keystore password can open the file and if the alias exists
          keytool -list -v \
            -keystore android/app/release-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

          echo -e "\n=== 3. Testing Key-Specific Password ==="
          # This verifies if the specific key password matches the key password secret
          keytool -keypasswd \
            -keystore android/app/release-key.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -new "${{ secrets.KEY_PASSWORD }}"
          
          echo "SUCCESS: Keystore password, alias, and key password are 100% correct!"
