name: Build, Release & Deploy PWA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_all:
    name: Build APK & Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. Restore Keystore & Create key.properties for Android APK
      - name: Restore Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Create key.properties
        run: |
          echo "storeFile=${{ github.workspace }}/android/app/release-key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      # 2. Build Optimized Release APK targeting armv7a
      - name: Build Optimized APK Release
        run: flutter build apk --release --target-platform android-arm

      # 3. Enable Web Platform (Generates the web/ directory)
      - name: Add Web Platform
        run: flutter create . --platforms=web

      # 4. Commit and push the auto-generated web/ directory back to main branch explicitly
      - name: Commit web directory
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/
          if git diff --staged --quiet; then
            echo "No changes to commit in web/"
          else
            git commit -m "chore: auto-generate web platform files [skip ci]"
            git push origin HEAD:refs/heads/main
          fi

      # 5. Build Web App (with correct base-href for your repository name)
      - name: Build Web PWA
        run: flutter build web --release --base-href "/Matrix-tv-flutter-client-/"

      # 6. Setup Pages Artifact
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      # 7. Upload release APK to GitHub Releases
      - name: Upload Release APK to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 8. Deploy Web Build to GitHub Pages
  deploy_web:
    needs: build_all
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
