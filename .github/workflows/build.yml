name: Build & Release Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. Restore Keystore & Create key.properties if secrets exist
      - name: Setup Android Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret found. Configuring signing..."
            mkdir -p android/app
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
            echo "storeFile=${{ github.workspace }}/android/app/release-key.jks" >> android/key.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          else
            echo "No keystore secret provided. Skipping signing."
          fi

      # 2. Build Optimized Release APK targeting arm
      - name: Build Optimized APK Release
        run: flutter build apk --release --target-platform android-arm

      # 3. Generate a dynamic version tag based on date and time
      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v1.0.$(date +%Y%m%d_%H%M%S)"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      # 4. Upload release APK to GitHub Releases
      - name: Upload Release APK to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: Manual Release (${{ steps.tag.outputs.tag_name }})
          tag_name: ${{ steps.tag.outputs.tag_name }}
          body: "Manually triggered release build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
