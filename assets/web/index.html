<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Matrix Client UI</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            padding: 16px; 
            margin: 0;
            max-width: 600px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .card { 
            background: #1e293b; 
            padding: 16px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            border: 1px solid #334155; 
        }
        h2, h3 { margin-top: 0; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #94a3b8; }
        input, button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0 12px 0; 
            background: #0f172a; 
            color: #fff; 
            border: 1px solid #475569; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            background: #3b82f6; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { background: #2563eb; }
        pre { 
            background: #0f172a; 
            padding: 10px; 
            border-radius: 4px; 
            overflow-x: auto; 
            border: 1px solid #334155; 
            font-size: 13px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h2>Matrix Custom Dashboard</h2>
    
    <div class="card">
        <h3>1. Homeserver Settings</h3>
        <label for="serverUrl">Server URL (Local, Tailscale, or Tunnel):</label>
        <input id="serverUrl" value="http://localhost:8082" />
    </div>

    <div class="card">
        <h3>2. Authentication</h3>
        <label for="username">Username:</label>
        <input id="username" placeholder="e.g. jeremy" />
        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="Password" />
        <button onclick="login()">Log In</button>
    </div>

    <div class="card">
        <h3>3. Session Output</h3>
        <pre id="output">Not authenticated yet.</pre>
    </div>

    <script>
        async function login() {
            const rawUrl = document.getElementById('serverUrl').value.trim();
            const baseUrl = rawUrl.replace(/\/+$/, '');
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const output = document.getElementById('output');

            if (!user || !pass) {
                output.innerText = "Error: Please enter both username and password.";
                return;
            }

            output.innerText = "Connecting to homeserver...";

            try {
                const res = await fetch(`${baseUrl}/_matrix/client/v3/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: "m.login.password",
                        identifier: { type: "m.id.user", user: user },
                        password: pass
                    })
                });
                
                const data = await res.json();
                if (res.ok) {
                    output.innerText = `Success!\nUser ID: ${data.user_id}\nAccess Token: ${data.access_token}`;
                } else {
                    output.innerText = `Matrix Error (${res.status}):\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (e) {
                output.innerText = `Network Exception:\n${e.message}\n\nCheck if the server URL is reachable and CORS/networking rules allow connections.`;
            }
        }
    </script>
</body>
</html>
